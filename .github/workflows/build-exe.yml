name: build-exe

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - launch-lowres-logo-color-gui.ps1
      - batch-process-videos-lowres-logo-color.ps1
      - watermark.png
      - build/build-exe.ps1
      - .github/workflows/build-exe.yml
  pull_request:
    paths:
      - launch-lowres-logo-color-gui.ps1
      - batch-process-videos-lowres-logo-color.ps1
      - watermark.png
      - build/build-exe.ps1
      - .github/workflows/build-exe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        shell: powershell
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -like 'refs/tags/v*') {
            $version = $ref -replace '^refs/tags/v', ''
          }
          else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          Write-Host "version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build the executable
        shell: powershell
        run: .\build\build-exe.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Check that the executable runs and unpacks its payload
        shell: powershell
        run: |
          $unpacked = Join-Path $env:LOCALAPPDATA 'video-scan\batch-process-videos-lowres-logo-color.ps1'
          Remove-Item -LiteralPath $unpacked -Force -ErrorAction SilentlyContinue

          # The runner has nobody to pick folders, so this only checks that the payload
          # survives the round trip into the executable; the process is killed afterwards.
          $process = Start-Process -FilePath .\dist\low-res-logo-preview.exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while (-not (Test-Path -LiteralPath $unpacked) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

          if (-not (Test-Path -LiteralPath $unpacked)) {
            throw 'The executable did not unpack the processing script.'
          }
          Write-Host 'The executable ran and unpacked its payload.'

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: low-res-logo-preview-${{ steps.version.outputs.version }}
          path: |
            dist/low-res-logo-preview.exe
            dist/low-res-logo-preview.exe.sha256
          if-no-files-found: error

      - name: Attach the build to the release
        if: startsWith(github.ref, 'refs/tags/v')
        # Bash rather than PowerShell: Actions runs powershell steps with
        # $ErrorActionPreference = 'Stop', which turns the "release not found" that
        # gh writes to stderr into a fatal error before the create can run.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/low-res-logo-preview.exe dist/low-res-logo-preview.exe.sha256)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
